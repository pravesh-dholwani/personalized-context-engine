llmProviders:

  openai:
    model: "gpt-4o-mini"
    temperature: 0.7
    maxTokens: 500

  # Separate, cheaper config for question analysis: near-zero temperature
  # and a small token budget, since the expected output is a compact JSON
  # object ({"intent": ..., "language": ..., "tone": ...}) rather than a
  # full reading.
  openai_classifier:
    model: "gpt-4o-mini"
    temperature: 0.0
    maxTokens: 60

  mock:
    model: "mock-v1"
    temperature: 0.0

resilience:

  intentClassifier:
    primaryProvider: "openai_classifier"
    fallbackStrategy: "keyword"
    maxRetries: 1
    timeoutSeconds: 2.0

  completion:
    primaryProvider: "openai"
    fallbackProviders: []
    finalFallbackProvider: "mock"
    maxRetries: 2
    backoffBaseMs: 200
